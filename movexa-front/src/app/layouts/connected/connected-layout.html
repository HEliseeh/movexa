<!-- ================================================================
     CONNECTED LAYOUT
     Barre du haut + menu latéral navy + contenu scrollable
     ================================================================ -->
<div class="layout">
  <app-topbar class="layout-topbar" [menuOpen]="menuOpen()" (menuToggle)="toggleMenu()" />

  <div class="layout-body">
    <nav
      id="main-nav"
      class="layout-sidenav"
      [class.layout-sidenav--open]="menuOpen()"
      aria-label="Navigation principale"
    >
      @for (item of menuItems(); track item.id) {
        <app-menu-component [item]="item" />
      }
    </nav>

    <main class="layout-content">
      <router-outlet />
    </main>
  </div>
</div>

<!-- Notifications (ToastService) -->
<app-toast />
