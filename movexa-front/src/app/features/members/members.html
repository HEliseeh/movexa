<div class="page">

  <!-- ===== EN-TÊTE ===== -->
  <header class="page-header">
    <div>
      <h1 class="page-title">Adhérents</h1>
      <p class="page-subtitle">{{ total() }} adhérent{{ total() > 1 ? 's' : '' }} au total</p>
    </div>
  </header>

  <!-- ===== BARRE OUTILS : recherche + onglets filtres ===== -->
  <div class="toolbar">

    <label class="search-wrapper" for="member-search">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input
        id="member-search"
        type="search"
        class="search-input"
        placeholder="Nom, e-mail ou forfait…"
        [ngModel]="search()"
        (ngModelChange)="onSearch($event)"
        aria-label="Rechercher un adhérent"
      />
    </label>

    <div class="tab-group" role="tablist" aria-label="Filtrer par statut">
      @for (tab of tabs; track tab) {
        <button
          type="button"
          role="tab"
          class="tab"
          [class.tab-active]="activeTab() === tab"
          [attr.aria-selected]="activeTab() === tab"
          (click)="setTab(tab)"
        >{{ tab }}</button>
      }
    </div>

  </div>

  <!-- ===== DATATABLE ===== -->
  <app-data-table
    [columns]="columns"
    [rows]="filteredRows()"
    [paginationConfig]="{ pageSize: 8 }"
    emptyMessage="Aucun adhérent trouvé pour ce filtre."
    (rowClick)="onRowClick($event)"
    (rowActionClick)="onRowClick($event)"
  />

</div>

<!-- ===== FAB actions rapides ===== -->
<app-fab [actions]="fabActions" (actionTriggered)="onFabAction($event)" />
