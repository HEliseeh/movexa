<!-- ================================================================
     ENTRÉE DE NAVIGATION — récursive
     ================================================================ -->

<!-- ---- Item principal ---- -->
<a
  mat-list-item
  class="nav-item"
  [class.nav-item--active]="isActive"
  [class.nav-item--disabled]="item.disabled"
  [class.nav-item--deep]="depth > 0"
  [style.padding-left.px]="16 + depth * 16"
  [matTooltip]="!expanded ? item.label : ''"
  matTooltipPosition="right"
  (click)="toggle($event)"
  [attr.aria-current]="isActive ? 'page' : null"
  [attr.aria-disabled]="item.disabled ?? false"
  [attr.aria-expanded]="hasChildren ? showChildren() : null"
>
  <!-- Icône -->
  <mat-icon class="nav-icon" aria-hidden="true">{{ item.icon }}</mat-icon>

  <!-- Libellé (masqué en mode réduit) -->
  @if (expanded) {
    <span class="nav-label">{{ item.label }}</span>

    <!-- Indicateur sous-menu -->
    @if (hasChildren) {
      <mat-icon
        class="nav-chevron"
        [class.nav-chevron--open]="showChildren()"
        aria-hidden="true"
      >expand_more</mat-icon>
    }
  }
</a>

<!-- ---- Sous-menus (récursion) ---- -->
@if (hasChildren && showChildren() && expanded) {
  <div class="nav-children" role="group" [attr.aria-label]="item.label">
    @for (child of item.children; track child.id) {
      <app-menu-component
        [item]="child"
        [depth]="depth + 1"
        [expanded]="expanded"
      />
    }
  </div>
}
