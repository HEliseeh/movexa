<!-- ================================================================
     ENTRÉE DE NAVIGATION — récursive
     ================================================================ -->
@if (hasChildren) {
  <button
    type="button"
    class="nav-item"
    [style.padding-left.px]="20 + depth() * 16"
    [attr.aria-expanded]="showChildren()"
    [disabled]="item().disabled"
    (click)="toggleChildren()"
  >
    <ng-container *ngTemplateOutlet="content" />
    <svg class="nav-chevron" [class.nav-chevron--open]="showChildren()" width="16" height="16" viewBox="0 0 24 24"
         fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M6 9l6 6 6-6" />
    </svg>
  </button>

  @if (showChildren()) {
    <div class="nav-children" role="group" [attr.aria-label]="item().label">
      @for (child of item().children; track child.id) {
        <app-menu-component [item]="child" [depth]="depth() + 1" />
      }
    </div>
  }
} @else if (item().disabled) {
  <span class="nav-item nav-item--disabled" aria-disabled="true" [style.padding-left.px]="20 + depth() * 16">
    <ng-container *ngTemplateOutlet="content" />
  </span>
} @else {
  <a
    class="nav-item"
    [routerLink]="item().route"
    routerLinkActive="nav-item--active"
    ariaCurrentWhenActive="page"
    [style.padding-left.px]="20 + depth() * 16"
  >
    <ng-container *ngTemplateOutlet="content" />
  </a>
}

<ng-template #content>
  <svg class="nav-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path [attr.d]="item().iconPath" />
  </svg>
  <span class="nav-label">{{ item().label }}</span>
</ng-template>
