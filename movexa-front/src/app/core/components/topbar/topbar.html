<header class="topbar">

  <!-- Gauche : bouton menu (mobile) + logo + version -->
  <div class="topbar-left">
    <button
      type="button"
      class="topbar-icon-btn topbar-menu-btn"
      (click)="menuToggle.emit()"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="main-nav"
      [attr.aria-label]="menuOpen() ? 'Fermer le menu' : 'Ouvrir le menu'"
    >
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" aria-hidden="true">
        <path [attr.d]="menuOpen() ? 'M6 6l12 12M18 6L6 18' : 'M4 7h16M4 12h16M4 17h16'" />
      </svg>
    </button>

    <app-logo [width]="168" />
    <span class="topbar-version">{{ version }}</span>
  </div>

  <!-- Droite : utilisateur + déconnexion -->
  <div class="topbar-right">
    @if (user()) {
      <div class="topbar-user">
        <div class="topbar-username">{{ displayName() }}</div>
        @if (roleLabel()) {
          <div class="topbar-role">{{ roleLabel() }}</div>
        }
      </div>
    }

    <button type="button" class="topbar-icon-btn" (click)="logout()" aria-label="Se déconnecter" title="Se déconnecter">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9 3h10a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H9M3 12h12M11 8l4 4-4 4" />
      </svg>
    </button>
  </div>

</header>
