<!-- Voile blanc derrière le menu ouvert : clic = fermeture -->
@if (isOpen()) {
  <div class="fab-backdrop" (click)="close()" aria-hidden="true"></div>
}

<div class="fab-container">

  <!-- ===== LISTE D'ACTIONS (s'affiche au-dessus du bouton) ===== -->
  @if (isOpen()) {
    <ul class="fab-menu" role="menu" aria-label="Actions disponibles">
      @for (action of actions(); track action.id) {
        <li role="none">
          <button
            class="fab-action"
            [class.fab-action-disabled]="action.disabled"
            type="button"
            role="menuitem"
            [attr.aria-disabled]="action.disabled ?? false"
            (click)="handleAction(action, $event)"
          >
            <span class="fab-action-label">{{ action.label }}</span>
            <span class="fab-action-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                @if (action.iconPath) {
                  <path [attr.d]="action.iconPath" />
                } @else {
                  <circle cx="12" cy="12" r="2" fill="currentColor" stroke="none" />
                }
              </svg>
            </span>
          </button>
        </li>
      }
    </ul>
  }

  <!-- ===== BOUTON FAB PRINCIPAL ===== -->
  <button
    class="fab-trigger"
    type="button"
    [attr.aria-expanded]="isOpen()"
    aria-haspopup="menu"
    [attr.aria-label]="isOpen() ? 'Fermer les actions' : 'Ouvrir les actions'"
    (click)="toggle()"
  >
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <path [attr.d]="isOpen() ? 'M6 6l12 12M18 6L6 18' : 'M4 7h16M4 12h16M4 17h16'" />
    </svg>
  </button>

</div>
